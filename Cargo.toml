[package]
name = "persisthotstuff-rst"
version = "0.1.0"
edition = "2021"

[dependencies]
colored = "2.0"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"

# Persistence layer dependencies
serde = { version = "1.0", features = ["derive"] }   # Serialization framework (derive macros for auto-implementing Serialize/Deserialize)
bincode = "1.3"                                        # Compact binary serialization format (much smaller than JSON)
crc32fast = "1.3"                                      # Hardware-accelerated CRC32 checksums for WAL entry integrity
tempfile = "3.0"                                       # Temporary files for testing WAL without polluting the filesystem

# gRPC / pluggable state machine dependencies
tonic = "0.12"                                         # gRPC framework for Rust (server + client)
prost = "0.13"                                         # Protocol Buffers runtime library
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[build-dependencies]
tonic-build = "0.12"                                   # Code generator for .proto → Rust at build time

[[example]]
name = "multi_replica_demo"
path = "examples/multi_replica_demo.rs"

[[example]]
name = "normal_case"
path = "examples/normal_case.rs"

[[example]]
name = "byzantine_failures"
path = "examples/byzantine_failures.rs"

[[example]]
name = "crash_recovery"
path = "examples/crash_recovery.rs"

[[example]]
name = "eval_crash_recovery"
path = "examples/eval_crash_recovery.rs"

[[example]]
name = "eval_membership_cycling"
path = "examples/eval_membership_cycling.rs"

[[example]]
name = "eval_commit_latency"
path = "examples/eval_commit_latency.rs"

[[example]]
name = "eval_performance_comparison"
path = "examples/eval_performance_comparison.rs"
